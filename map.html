<!DOCTYPE html>
<html lang="th" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Rice Farming Intelligence - แผนที่แปลงนา GIS</title>
    
    <!-- Google Fonts: Noto Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/map-config.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Leaflet GIS Mapping Framework -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="assets/css/map.css">
</head>
<body class="bg-navy-950 text-slate-100 flex flex-col h-screen overflow-hidden selection:bg-emerald-500 selection:text-white">

    <!-- TOP NAVIGATION BAR -->
    <nav class="glass-panel border-b border-slate-800/80 px-4 lg:px-8 py-3 flex-shrink-0 z-50 relative">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            
            <!-- Brand Logo & Title -->
            <div class="flex items-center gap-3">
                <a href="home.html" class="flex items-center gap-3 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-cyan-500 p-0.5 flex items-center justify-center shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">
                        <div class="w-full h-full bg-navy-950 rounded-[10px] flex items-center justify-center">
                            <i data-lucide="sprout" class="w-5 h-5 text-emerald-400"></i>
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-extrabold text-base tracking-tight bg-gradient-to-r from-white via-slate-200 to-emerald-400 bg-clip-text text-transparent">
                            Precision Rice
                        </span>
                        <span class="text-[9px] font-medium tracking-widest text-emerald-400/90 uppercase -mt-1">
                            GIS Intelligence
                        </span>
                    </div>
                </a>
            </div>

            <!-- Central Nav Links -->
            <div class="hidden md:flex items-center gap-1 bg-navy-900/80 p-1 rounded-full border border-slate-800">
                <a href="home.html" class="px-3.5 py-1.5 rounded-full text-xs font-medium text-slate-300 hover:text-emerald-400 hover:bg-slate-800/50 transition-all flex items-center gap-1.5">
                    <i data-lucide="home" class="w-3.5 h-3.5"></i> หน้าแรก
                </a>
                <a href="map.html" class="px-3.5 py-1.5 rounded-full text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 flex items-center gap-1.5">
                    <i data-lucide="map" class="w-3.5 h-3.5"></i> แผนที่แปลงนา
                </a>
                <a href="dashboard.html" class="px-3.5 py-1.5 rounded-full text-xs font-medium text-slate-300 hover:text-emerald-400 hover:bg-slate-800/50 transition-all flex items-center gap-1.5">
                    <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i> แดชบอร์ด
                </a>
                <a href="drawtool.html" class="px-3.5 py-1.5 rounded-full text-xs font-medium text-slate-300 hover:text-emerald-400 hover:bg-slate-800/50 transition-all flex items-center gap-1.5">
                    <i data-lucide="vector-polygon" class="w-3.5 h-3.5 extracted-style-1" ></i> เครื่องมือวาดแปลง
                </a>
                <a href="rainradar.html" class="px-3.5 py-1.5 rounded-full text-xs font-medium text-slate-300 hover:text-emerald-400 hover:bg-slate-800/50 transition-all flex items-center gap-1.5">
                    <i data-lucide="cloud-rain" class="w-3.5 h-3.5"></i> เรดาร์ฝน
                </a>
            </div>

            <!-- Action Buttons: Back to Home & Optional Backup File Selector -->
            <div class="flex items-center gap-2">
                <!-- Backup File Upload Input Button (Hidden unless URL fetch fails or manually triggered) -->
                <div id="upload-container" class="hidden">
                    <input type="file" id="geojson-file-input" accept=".geojson, .json" class="hidden">
                    <button id="btn-upload" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-300 bg-amber-500/10 border border-amber-500/30 hover:bg-amber-500/20 transition-all flex items-center gap-1.5">
                        <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                        <span>Upload GeoJSON</span>
                    </button>
                </div>

                <a href="home.html" class="px-3.5 py-1.5 rounded-xl text-xs font-medium text-slate-200 bg-slate-900 border border-slate-700 hover:border-emerald-500/50 transition-all flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span>กลับหน้าแรก</span>
                </a>
            </div>

        </div>
    </nav>

    <!-- MAIN MAP CONTAINER WITH FLOATING OVERLAYS -->
    <main class="relative flex-1 w-full h-full">
        
        <!-- Interactive Leaflet Canvas Container -->
        <div id="map"></div>

        <!-- FLOATING CONTROL PANEL: FILTER & DATA STATUS (TOP-LEFT) -->
        <div class="absolute top-4 left-4 z-20 max-w-xs sm:max-w-sm w-full space-y-2 pointer-events-none">
            
            <!-- Filter Card -->
            <div class="glass-panel p-3.5 rounded-2xl shadow-2xl pointer-events-auto border border-slate-800 space-y-3">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <div class="flex items-center gap-2">
                        <i data-lucide="filter" class="w-4 h-4 text-emerald-400"></i>
                        <span class="text-xs font-bold text-white tracking-wide">ตัวกรองแปลงนา</span>
                    </div>
                    <span id="field-count-badge" class="px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-[10px] font-mono font-bold text-emerald-400">
                        0 แปลง
                    </span>
                </div>

                <!-- Province Dropdown Filter -->
                <div class="space-y-1">
                    <label class="text-[11px] text-slate-400 font-medium flex items-center gap-1">
                        <i data-lucide="map-pin" class="w-3 h-3 text-cyan-400"></i>
                        จังหวัด
                    </label>
                    <select id="province-filter" class="w-full bg-navy-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
                        <option value="ALL">ทุกจังหวัด (All Provinces)</option>
                        <option value="สุพรรณบุรี">สุพรรณบุรี</option>
                        <option value="นครปฐม">นครปฐม</option>
                        <option value="พระนครศรีอยุธยา">พระนครศรีอยุธยา</option>
                        <option value="ชัยนาท">ชัยนาท</option>
                        <option value="สิงห์บุรี">สิงห์บุรี</option>
                    </select>
                </div>

                <!-- Field ID Search Input -->
                <div class="space-y-1">
                    <label class="text-[11px] text-slate-400 font-medium flex items-center gap-1">
                        <i data-lucide="search" class="w-3 h-3 text-cyan-400"></i>
                        ค้นหาด้วยรหัสแปลง (Field ID)
                    </label>
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="พิมพ์รหัสแปลง เช่น SP-001..." class="w-full bg-navy-900 border border-slate-700 rounded-xl pl-3 pr-8 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
                        <button id="clear-search-btn" class="absolute right-2.5 top-2 text-slate-500 hover:text-slate-300 hidden">
                            <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>

                <!-- Status Indicator Message Banner -->
                <div id="status-banner" class="flex items-center gap-2 p-2 rounded-xl bg-navy-900/90 border border-slate-800 text-[11px] text-slate-300">
                    <span class="relative flex h-2 w-2 flex-shrink-0">
                        <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span id="status-dot" class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span id="status-text" class="truncate font-medium">กำลังโหลด GeoJSON จากเซิร์ฟเวอร์...</span>
                </div>

                <!-- Explicit Backup File Upload Trigger inside Filter Panel if error occurs -->
                <button id="btn-manual-upload" class="hidden w-full py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-navy-950 font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 transition-all">
                    <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                    <span>เลือกไฟล์ GeoJSON จากเครื่อง</span>
                </button>
            </div>

        </div>

        <!-- FLOATING BASEMAP SWITCHER CONTROL (TOP-RIGHT) -->
        <div class="absolute top-4 right-4 z-20 pointer-events-auto">
            <div class="glass-panel p-2 rounded-2xl border border-slate-800 flex items-center gap-1 shadow-2xl">
                <button id="btn-basemap-satellite" class="basemap-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 flex items-center gap-1.5 transition-all">
                    <i data-lucide="satellite" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">ESRI Satellite</span>
                </button>
                <button id="btn-basemap-topo" class="basemap-btn px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 border border-transparent flex items-center gap-1.5 transition-all">
                    <i data-lucide="mountain" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">ESRI Topo</span>
                </button>
                <button id="btn-basemap-dark" class="basemap-btn px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 border border-transparent flex items-center gap-1.5 transition-all">
                    <i data-lucide="moon" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">ESRI Dark Canvas</span>
                </button>
            </div>
        </div>

        <!-- FLOATING MINIMAL MAP LEGEND (BOTTOM-RIGHT) -->
        <div class="absolute bottom-6 right-4 z-20 pointer-events-auto max-w-xs">
            <div class="glass-panel p-3 rounded-2xl border border-slate-800 shadow-2xl space-y-2">
                <div class="text-[11px] font-bold text-slate-200 border-b border-slate-800/80 pb-1 flex items-center justify-between">
                    <span>คำอธิบายสัญลักษณ์ (Legend)</span>
                    <i data-lucide="layers" class="w-3.5 h-3.5 text-emerald-400"></i>
                </div>
                <div class="grid grid-cols-1 gap-1.5 text-[11px]">
                    <div class="flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded border border-emerald-400 bg-emerald-500/40 inline-block"></span>
                        <span class="text-slate-300">แปลงนาข้าว (Rice Field Polygons)</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded border border-cyan-400 bg-cyan-400/60 inline-block"></span>
                        <span class="text-slate-300">แปลงที่เลือก (Selected Field)</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- FLOATING RE-CENTER BUTTON (BOTTOM-LEFT) -->
        <div class="absolute bottom-6 left-4 z-20 pointer-events-auto">
            <button id="btn-reset-view" class="glass-panel p-2.5 rounded-xl border border-slate-800 text-slate-300 hover:text-emerald-400 hover:bg-navy-900 transition-all flex items-center gap-2 text-xs font-semibold shadow-2xl" title="ซูมไปยังขอบเขตแปลงนาทั้งหมด">
                <i data-lucide="maximize-2" class="w-4 h-4 text-emerald-400"></i>
                <span class="hidden sm:inline">ซูมพอดีทุกแปลง</span>
            </button>
        </div>

    </main>

    <script src="assets/js/map.js"></script>
</body>
</html>
